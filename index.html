<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK BMS V20 PRO Monitor</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#101418;color:white;font-family:Arial}
.container{max-width:1200px;margin:auto;padding:20px}
.card,.panel{background:#181e24;border:1px solid #303840;border-radius:12px;padding:16px;margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.value{font-size:28px;font-weight:bold;margin-top:8px}
.label{color:#9aa6b2}
button{background:#35d07f;border:0;padding:10px;border-radius:8px;cursor:pointer}
canvas{height:460px!important}
.good{color:#35d07f}.warn{color:#f2c94c}.bad{color:#ff5c5c}
</style>
</head>
<body>
<div class="container">

<h2>🔋 JK BMS V20 PRO Remote Monitor</h2>

<div class="panel">
<h3>Live Battery</h3>
<div class="cards">
<div class="card"><div class="label">Voltage</div><div class="value" id="voltage">---</div></div>
<div class="card"><div class="label">Current</div><div class="value" id="current">---</div></div>
<div class="card"><div class="label">Power</div><div class="value" id="power">---</div></div>
<div class="card"><div class="label">SOC</div><div class="value" id="soc">---</div></div>
</div>
</div>

<div class="panel">
<h3>📈 PRO Historical Monitoring</h3>
<canvas id="chart"></canvas>
</div>

<div class="panel">
<h3>Statistics</h3>
<div id="stats">Waiting data...</div>
</div>

</div>

<script>
const HOST="wss://4c3d779ff55d416f8193eaa976fce2c4.s1.eu.hivemq.cloud:8884/mqtt";
const TOPIC="jk-bms/data";

let client=mqtt.connect(HOST,{
username:"nejs23",
password:"",
clientId:"jk-pro-"+Math.random()
});

let labels=[],voltage=[],current=[],power=[],soc=[];
let chart;

client.on("connect",()=>{
console.log("connected");
client.subscribe(TOPIC);
});

client.on("message",(t,msg)=>{
let d=JSON.parse(msg);
update(d);
graph(d);
});

function update(d){
let v=Number(d.voltage??d.pack_voltage??0);
let c=Number(d.current??d.pack_current??0);
let p=Number(d.power??d.pack_power??v*c);
let s=Number(d.soc??0);

document.getElementById("voltage").innerHTML=v.toFixed(2)+" V";
document.getElementById("current").innerHTML=c.toFixed(2)+" A";
document.getElementById("power").innerHTML=p.toFixed(0)+" W";
document.getElementById("soc").innerHTML=s.toFixed(0)+" %";

document.getElementById("stats").innerHTML=
"Voltage: "+v.toFixed(2)+"V<br>"+
"Current: "+c.toFixed(2)+"A<br>"+
"Power: "+p.toFixed(0)+"W<br>"+
"SOC: "+s.toFixed(0)+"%";
}

function graph(d){

labels.push(new Date().toLocaleTimeString());
voltage.push(Number(d.voltage??d.pack_voltage??0));
current.push(Number(d.current??d.pack_current??0));
power.push(Number(d.power??d.pack_power??0));
soc.push(Number(d.soc??0));

if(labels.length>120){
labels.shift();voltage.shift();current.shift();power.shift();soc.shift();
}

if(!chart){
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:labels,
datasets:[
{name:"Voltage",label:"Voltage (V)",data:voltage,yAxisID:"v",tension:.45,borderWidth:3},
{name:"Current",label:"Current (A)",data:current,yAxisID:"c",tension:.45,borderWidth:3},
{name:"Power",label:"Power (W)",data:power,yAxisID:"p",tension:.45,borderWidth:3},
{name:"SOC",label:"SOC (%)",data:soc,yAxisID:"s",tension:.45,borderWidth:3}
]},
options:{
animation:{duration:0},
responsive:true,
interaction:{mode:"index",intersect:false},
scales:{
v:{position:"left",ticks:{color:"#9aa6b2"}},
c:{position:"right",ticks:{color:"#9aa6b2"}},
p:{position:"right",ticks:{color:"#9aa6b2"}},
s:{position:"right",min:0,max:100,ticks:{color:"#9aa6b2"}}
}
}
});
}
else{
chart.data.labels=labels;
chart.data.datasets[0].data=voltage;
chart.data.datasets[1].data=current;
chart.data.datasets[2].data=power;
chart.data.datasets[3].data=soc;
chart.update("none");
}
}
</script>
</body>
</html>
